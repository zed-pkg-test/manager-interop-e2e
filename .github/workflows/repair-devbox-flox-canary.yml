name: align Devbox and Flox canary expectations

on:
  push:
    branches:
      - agent/den-2487-devbox-flox-canary
    paths:
      - .github/workflows/repair-devbox-flox-canary.yml

permissions:
  contents: write

concurrency:
  group: repair-devbox-flox-canary
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact canary branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-2487-devbox-flox-canary
          persist-credentials: true
          show-progress: false

      - name: Require inherited plan platforms for Flox tools
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/devbox_flox_export_canary.py')
          text = path.read_text()
          old = '            "node": {"pkg-path": "nodejs_22", "version": "22.11.0"},\n'
          new = '''            "node": {
              "pkg-path": "nodejs_22",
              "version": "22.11.0",
              "systems": ["aarch64-darwin"],
            },
          '''
          if old not in text:
              raise SystemExit('Flox node expectation anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 -m py_compile scripts/devbox_flox_export_canary.py

      - name: Commit ordinary canary source
        run: |
          set -euo pipefail
          rm .github/workflows/repair-devbox-flox-canary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/devbox_flox_export_canary.py .github/workflows/repair-devbox-flox-canary.yml
          git diff --cached --check
          git commit -m 'test(DEN-2487): require inherited Flox tool systems'
          git push origin HEAD:agent/den-2487-devbox-flox-canary
